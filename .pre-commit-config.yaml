repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        exclude: ^infra/
      - id: end-of-file-fixer
        exclude: ^(data/cache|data/synthetic|evals/cassettes|evals/reports|evals/baselines)/
      - id: trailing-whitespace
        exclude: ^(data/cache|data/synthetic|evals/cassettes|evals/reports|evals/baselines)/
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types: [python]
