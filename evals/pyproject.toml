[project]
name = "claimpilot-evals"
version = "0.1.0"
description = "Eval runner, suites, baselines and regression gates"
requires-python = ">=3.12,<3.13"
dependencies = [
    "claimpilot-core",
    "matplotlib>=3.9",
]

[project.scripts]
claimpilot-eval = "claimpilot_evals.cli:main"
claimpilot-eval-compare = "claimpilot_evals.compare:main"
claimpilot-smoke = "claimpilot_evals.smoke:main"

[tool.uv.sources]
claimpilot-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
