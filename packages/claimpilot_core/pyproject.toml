[project]
name = "claimpilot-core"
version = "0.1.0"
description = "Domain models, database, LLM gateway, PII handling and claim state machine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "cryptography>=43",
    "jinja2>=3.1",
    "langfuse>=3.0",
    "anthropic[bedrock]>=1.0",
]

[project.optional-dependencies]
pii = [
    "presidio-analyzer>=2.2.355",
    "transformers>=4.46",
    "torch>=2.5",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
