[project]
name = "claimpilot-mcp"
version = "0.1.0"
description = "Read-only MCP server over the ClaimPilot API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
]

[project.scripts]
claimpilot-mcp = "claimpilot_mcp.server:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
