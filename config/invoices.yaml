# Supplier invoices (Phase 3). Our own legal entities: an invoice must be addressed to one of
# them. They are the fictional buyer group of the synthetic set (data/synthetic/invoices).
buyers:
  - { name: "Lekárne Sever s.r.o.", ico: "90882750", vat_id: "SK2997673481" }
  - { name: "Lekárne Sever Retail s.r.o.", ico: "93533446", vat_id: "SK2992944152" }

# Validation: how far a printed sum may sit from its parts (rounding of each part).
validation:
  line_tolerance: "0.01"
  sum_tolerance: "0.01"

# Matching against the ERP (stage 3.6): quantity exact, unit price within a share of the order
# price, the invoice total within an absolute amount. A supplier can have its own values.
matching:
  price_tolerance_pct: "0.5"
  total_tolerance: "0.05"
  per_supplier: {}

# Routing (stage 3.7): above this amount a senior handler decides.
routing:
  senior_amount: "20000.00"

# Hard limits (stage 3.10): an invoice with more items than this goes to NEEDS_INFO ("split the
# invoice"). 400 items are about 34 extraction calls; the budget for that is in the worker settings.
limits:
  max_items: 400

# Retention (ADR-016). `invoice_years`: the invoice record and its export.xml are kept this many
# full calendar years after the end of the year the invoice closed in (accounting records);
# then the case and its files are deleted. `personal_data_days`: after a final state, or when
# nothing has moved for this long, the personal data (vault, page text, uploaded file and renders,
# handler notes) is erased and the accounting record stays.
retention:
  invoice_years: 10
  personal_data_days: 365
