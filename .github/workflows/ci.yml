name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: claimpilot
          POSTGRES_PASSWORD: claimpilot
          POSTGRES_DB: claimpilot_test
        ports: ["5438:5432"]
        options: >-
          --health-cmd "pg_isready -U claimpilot" --health-interval 5s --health-retries 20
    env:
      CLAIMPILOT_DATABASE_URL: postgresql+psycopg://claimpilot:claimpilot@127.0.0.1:5438/claimpilot_test
      # A throwaway key for the test vault; it protects nothing.
      CLAIMPILOT_PII_VAULT_KEY: 2ip5tbrSDe9R1RPhk80c84uRJ2nNDpTOAZH48YUGUTk=
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Cache the NER and reranker models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-ner-reranker-v1
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: uv run pyright
      - name: Migrations
        run: uv run alembic upgrade head
      - name: Unit tests
        run: uv run pytest
      - name: Database tests
        run: uv run pytest -m db
      - name: Eval gate on recorded responses
        # Replays cassettes on the committed ground truth and parse cache (no PDFs, no Docling run);
        # a prompt change without a fresh recording fails here as stale.
        run: |
          if ls evals/baselines/*.json >/dev/null 2>&1; then
            uv run claimpilot-eval run --suite all --split dev --replay
            uv run claimpilot-eval-compare --latest
          fi

  worker-image:
    # The worker runs natively on macOS in Phase 1; this job keeps its container image honest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build worker image
        # PREFETCH=0: the unit tests need no model files; the deploy builds with them.
        run: docker build --build-arg PREFETCH=0 -f services/worker/Dockerfile -t claimpilot-worker:ci .
      - name: Unit tests inside the image
        # Export tests need the core mock and the api package, which the worker image does not ship;
        # the checks job runs them.
        run: |
          docker run --rm -v "$PWD/tests:/app/tests:ro" -v "$PWD/pyproject.toml:/app/pyproject.toml:ro" \
            claimpilot-worker:ci sh -c "uv pip install --python /app/.venv/bin/python pytest pytest-asyncio respx hypothesis && \
            /app/.venv/bin/python -m pytest tests/core tests/worker -m 'not smoke and not live and not db' -q \
            --ignore tests/worker/test_erp_export.py --ignore tests/worker/test_invoice_export_db.py \
            --ignore tests/worker/test_ubl_export.py"

  infra:
    # Terraform for the AWS deployment, checked without an AWS account: mocked providers only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.59.1
      - uses: astral-sh/setup-uv@v6
      - name: Format, validate, mocked tests
        run: |
          terraform -chdir=infra/terraform fmt -check -recursive
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate
          terraform -chdir=infra/terraform test
          terraform -chdir=infra/terraform/bootstrap init -backend=false -input=false
          terraform -chdir=infra/terraform/bootstrap validate
      - name: tflint
        working-directory: infra/terraform
        run: |
          tflint --init
          tflint --recursive
      - name: checkov
        run: uvx checkov==3.3.29 -d infra/terraform --framework terraform --quiet --compact
      - name: Deploy scripts
        run: shellcheck scripts/deploy/*.sh

  images:
    # The deployment's images on the architecture they run on (Graviton), not pushed anywhere.
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - { name: api, dockerfile: services/api/Dockerfile, context: . }
          - { name: core-mock, dockerfile: services/core_mock/Dockerfile, context: . }
          - { name: mcp, dockerfile: services/mcp_server/Dockerfile, context: . }
          - { name: ui, dockerfile: ui/Dockerfile, context: ., extra: --build-context crm-ui=../crm-ui }
    steps:
      - uses: actions/checkout@v4
      # The review UI's design system lives in its own repository (@crm-ui/react), next to this one.
      - uses: actions/checkout@v4
        if: matrix.name == 'ui'
        with:
          repository: ${{ vars.CRM_UI_REPOSITORY || 'kavicka/crm-ui' }}
          token: ${{ secrets.CRM_UI_TOKEN || github.token }}
          path: crm-ui
      - if: matrix.name == 'ui'
        run: mv crm-ui ../crm-ui
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }}
        run: docker build -f ${{ matrix.dockerfile }} ${{ matrix.extra }} -t claimpilot-${{ matrix.name }}:ci ${{ matrix.context }}

  e2e:
    # The review UI against the real api and a seeded database; no models run.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: claimpilot
          POSTGRES_PASSWORD: claimpilot
          POSTGRES_DB: claimpilot
        ports: ["5438:5432"]
        options: >-
          --health-cmd "pg_isready -U claimpilot" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4
        ports: ["6389:6379"]
    env:
      # A throwaway key for the seeded test vault; it protects nothing.
      CLAIMPILOT_PII_VAULT_KEY: 2ip5tbrSDe9R1RPhk80c84uRJ2nNDpTOAZH48YUGUTk=
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      # ui/ links the design system from ../../crm-ui/packages/ui (its own repository).
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.CRM_UI_REPOSITORY || 'kavicka/crm-ui' }}
          token: ${{ secrets.CRM_UI_TOKEN || github.token }}
          path: crm-ui
      - run: mv crm-ui ../crm-ui
      - run: pnpm install --frozen-lockfile
        working-directory: ../crm-ui/packages/ui
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: ui
      - name: End-to-end tests
        run: pnpm e2e
        working-directory: ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report
