name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: claimpilot
          POSTGRES_PASSWORD: claimpilot
          POSTGRES_DB: claimpilot_test
        ports: ["5438:5432"]
        options: >-
          --health-cmd "pg_isready -U claimpilot" --health-interval 5s --health-retries 20
    env:
      CLAIMPILOT_DATABASE_URL: postgresql+psycopg://claimpilot:claimpilot@127.0.0.1:5438/claimpilot_test
      CLAIMPILOT_LLM_CASSETTE_MODE: replay
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Cache the NER model for the PII guard
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-wikineural-multilingual-ner
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: uv run pyright
      - name: Migrations
        run: uv run alembic upgrade head
      - name: Unit and database tests
        run: uv run pytest -m "not smoke and not live"
      - name: Eval gate on recorded responses
        # Replays cassettes on the committed ground truth and parse cache (no PDFs, no Docling run);
        # a prompt change without a fresh recording fails here as stale.
        run: |
          if ls evals/baselines/*.json >/dev/null 2>&1; then
            uv run claimpilot-eval run --suite all --split dev --replay
            uv run claimpilot-eval-compare --latest
          fi

  worker-image:
    # The worker runs natively on macOS in Phase 1; this job keeps its container image honest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build worker image
        run: docker build -f services/worker/Dockerfile -t claimpilot-worker:ci .
      - name: Unit tests inside the image
        run: |
          docker run --rm -v "$PWD/tests:/app/tests:ro" -v "$PWD/pyproject.toml:/app/pyproject.toml:ro" \
            claimpilot-worker:ci sh -c "uv pip install --python /app/.venv/bin/python pytest pytest-asyncio respx hypothesis && \
            /app/.venv/bin/python -m pytest tests/core tests/worker -m 'not smoke and not live and not db' -q"
