name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: claimpilot
          POSTGRES_PASSWORD: claimpilot
          POSTGRES_DB: claimpilot_test
        ports: ["5438:5432"]
        options: >-
          --health-cmd "pg_isready -U claimpilot" --health-interval 5s --health-retries 20
    env:
      CLAIMPILOT_DATABASE_URL: postgresql+psycopg://claimpilot:claimpilot@127.0.0.1:5438/claimpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Cache the NER and reranker models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-ner-reranker-v1
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: uv run pyright
      - name: Migrations
        run: uv run alembic upgrade head
      - name: Unit tests
        run: uv run pytest
      - name: Database tests
        run: uv run pytest -m db
      - name: Eval gate on recorded responses
        # Replays cassettes on the committed ground truth and parse cache (no PDFs, no Docling run);
        # a prompt change without a fresh recording fails here as stale.
        run: |
          if ls evals/baselines/*.json >/dev/null 2>&1; then
            uv run claimpilot-eval run --suite all --split dev --replay
            uv run claimpilot-eval-compare --latest
          fi

  worker-image:
    # The worker runs natively on macOS in Phase 1; this job keeps its container image honest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build worker image
        run: docker build -f services/worker/Dockerfile -t claimpilot-worker:ci .
      - name: Unit tests inside the image
        run: |
          docker run --rm -v "$PWD/tests:/app/tests:ro" -v "$PWD/pyproject.toml:/app/pyproject.toml:ro" \
            claimpilot-worker:ci sh -c "uv pip install --python /app/.venv/bin/python pytest pytest-asyncio respx hypothesis && \
            /app/.venv/bin/python -m pytest tests/core tests/worker -m 'not smoke and not live and not db' -q"

  e2e:
    # The review UI against the real api and a seeded database; no models run.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: claimpilot
          POSTGRES_PASSWORD: claimpilot
          POSTGRES_DB: claimpilot
        ports: ["5438:5432"]
        options: >-
          --health-cmd "pg_isready -U claimpilot" --health-interval 5s --health-retries 20
      redis:
        image: redis:7.4
        ports: ["6389:6379"]
    env:
      # A throwaway key for the seeded test vault; it protects nothing.
      CLAIMPILOT_PII_VAULT_KEY: 2ip5tbrSDe9R1RPhk80c84uRJ2nNDpTOAZH48YUGUTk=
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: ui
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: ui
      - name: End-to-end tests
        run: pnpm e2e
        working-directory: ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: ui/playwright-report
